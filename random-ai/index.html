<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random.AI: Dynamic Random Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        input, button {
            font-size: 18px;
            padding: 10px;
            margin: 10px;
            width: 80%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result, #info, #history {
            font-size: 18px;
            margin-top: 20px;
            color: #333;
            font-weight: bold;
            word-wrap: break-word;
        }
        .error {
            color: red;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Random.AI: Dynamic Random Number Generator</h1>
        <p>Fill in the form below to generate random numbers based on your input.</p>
        
        <form id="randomForm">
            <label for="count">Count (Number of random numbers to generate):</label>
            <input type="number" id="count" name="count" min="1"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random.AI: Dynamic Random Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result, #info {
            font-size: 18px;
            margin-top: 20px;
            color: #333;
            font-weight: bold;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Random.AI: Dynamic Random Number Generator</h1>
        <p>Click the button to generate random numbers based on the URL.</p>
        <button onclick="generateNumbers()">Generate</button>
        <p id="result">-</p>
        <p id="info"></p>
    </div>

    <script>
        // Function to extract the range from the URL path
        function getRangeFromURL() {
            const path = window.location.pathname.split('/');
            const range = path[path.length - 1].split('-');
            return range.map(Number); // Convert the range parts to numbers
        }

        async function getIP() {
            try {
                let response = await fetch("https://api64.ipify.org?format=json");
                let data = await response.json();
                return data.ip;
            } catch (error) {
                return "Unknown IP";
            }
        }

        async function generateNumbers() {
            const range = getRangeFromURL();
            const numCount = range[0]; // How many numbers to generate
            const maxRange = range[1]; // Max number (upper bound)

            // If numCount is more than maxRange, return an error
            if (numCount > maxRange) {
                document.getElementById("result").innerText = "Error: Cannot generate more numbers than the maximum range!";
                return;
            }

            // Generate unique random numbers
            let numbers = [];
            while (numbers.length < numCount) {
                let num = Math.floor(Math.random() * maxRange) + 1;
                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }

            // Get IP and Browser Info
            let ip = await getIP();
            let now = new Date();
            let timestamp = now.toLocaleString();
            let browserInfo = navigator.userAgent;

            // Display the results
            document.getElementById("result").innerText = numbers.join(", ");
            document.getElementById("info").innerText = 
                `Generated at: ${timestamp} | IP: ${ip} | Browser: ${browserInfo}`;
        }
    </script>

</body>
</html>

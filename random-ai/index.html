<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random AI Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        h1 {
            font-size: 22px;
            color: #333;
            font-weight: normal;
        }
        #dynamicTitle {
            font-size: 18px;
            font-weight: lighter;
            color: #666;
        }
        #result {
            font-size: 40px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            padding: 10px;
            border: 2px dashed #333;
            display: inline-block;
            width: 100%;
        }
        #info {
            font-size: 14px;
            color: #555;
            text-align: left;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
        }
        .input-group input {
            width: 48%;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 120px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .separator {
            border-top: 1px solid #ddd;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        footer {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="pageTitle">Random AI Number Generator</h1>
        <h2 id="dynamicTitle"></h2>

        <p id="result">-</p>
        <p id="info"></p>

        <div class="separator"></div>

        <h3>Generate Another One</h3> <!-- Moved as a title for the form -->

        <form id="randomForm">
            <div class="input-group">
                <input type="number" id="count" name="count" min="1" required placeholder="Count">
                <input type="number" id="max" name="max" min="1" required placeholder="Max">
            </div>
            <button type="submit">Generate</button>
        </form>

        <p id="errorMessage" class="error"></p>
    </div>

    <footer>
        <p>Code generated using <strong>ChatGPT</strong> (Version GPT-4.0) | Under 25</p>
    </footer>

    <script>
        function getValuesFromURL() {
            const params = new URLSearchParams(window.location.search);
            const values = params.get('values');
            if (values) {
                return values.split('-').map(Number);
            }
            return [6, 12]; 
        }

        function updateTitles(count, max) {
            document.title = `Random AI ${count} from ${max} Number Generator`;
            document.getElementById('pageTitle').innerHTML = `Random AI <b>${count}</b> from <b>${max}</b> Number Generator`;
            document.getElementById('dynamicTitle').innerText = `Generating ${count} numbers from a max of ${max}`;
        }

        async function getIP() {
            try {
                let response = await fetch("https://api64.ipify.org?format=json");
                let data = await response.json();
                return data.ip;
            } catch (error) {
                return "Unknown IP";
            }
        }

        async function generateNumbers(count, max) {
            if (count > max) {
                document.getElementById("result").innerText = "Error: Count cannot be greater than Max!";
                return;
            }

            let numbers = [];
            while (numbers.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }

            let ip = await getIP();
            let now = new Date();
            let timestamp = now.toLocaleString('en-GB', { timeZone: 'Europe/Bucharest' });

            let ua = navigator.userAgent;
            let device = /Android|iPhone/i.test(ua) ? "Mobile" : "Desktop";
            let browser = /Chrome/.test(ua) ? "Chrome" : /Firefox/.test(ua) ? "Firefox" : /Safari/.test(ua) ? "Safari" : "Unknown";
            let version = ua.match(/(Chrome|Firefox|Safari)\/(\d+)/);
            let browserVersion = version ? version[2] : "Unknown";

            document.getElementById("result").innerText = numbers.join(", ");
            document.getElementById("info").innerText = 
                `Generated at: ${timestamp}\nIP: ${ip}\nBrowser: ${browser} v${browserVersion}\nDevice: ${device}`;

            updateHistory();
        }

        function prefillForm() {
            const [count, max] = getValuesFromURL();
            document.getElementById('count').value = count;
            document.getElementById('max').value = max;
            updateTitles(count, max);
        }

        document.getElementById('randomForm').onsubmit = function(event) {
            event.preventDefault();
            const count = parseInt(document.getElementById('count').value);
            const max = parseInt(document.getElementById('max').value);

            if (count <= 0 || max <= 0) {
                document.getElementById("errorMessage").innerText = "Error: Both Count and Max must be greater than 0.";
                return;
            }

            if (count > max) {
                document.getElementById("errorMessage").innerText = "Error: Count must be less than or equal to Max.";
                return;
            }

            document.getElementById("errorMessage").innerText = "";

            generateNumbers(count, max);

            let newUrl = `?values=${count}-${max}`;
            window.history.pushState({}, '', newUrl);
        }

        function updateHistory() {
            let today = new Date().toISOString().split('T')[0];
            let history = JSON.parse(localStorage.getItem('history')) || {};
            history[today] = (history[today] || 0) + 1;
            localStorage.setItem('history', JSON.stringify(history));
            document.getElementById("info").innerText += `\nGenerated today: ${history[today]} times`;
        }

        window.onload = function() {
            prefillForm();
            const [count, max] = getValuesFromURL();
            if (count && max) {
                generateNumbers(count, max);
            }
            updateHistory();
        };
    </script>

</body>
</html>

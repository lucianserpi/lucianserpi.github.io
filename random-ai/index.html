<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random AI Number Generator</title>
    <link rel="icon" href="dice.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 10px;
        }
        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        #result {
            font-size: 40px;
            font-weight: bold;
            color: #333;
            padding: 16px;
            border: 2px dashed #333;
        }
        #info {
            font-size: 14px;
            color: #555;
            text-align: left;
        }
        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            gap: 8px;
        }
        .input-group label {
            font-size: 14px;
            color: #333;
            display: block;
            margin-bottom: 4px;
        }
        .input-container {
            display: flex;
            flex-direction: column;
            align-items: left;
        }
        .input-group input {
            padding: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
            max-width: 100px;
        }
        .dash {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 120px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .separator {
            border-top: 1px solid #ddd;
            margin: 40px 0;
        }
        footer {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
        <div class="logo"> <img src="dice.png" alt="Dice Icon" style="width: 40px; height: 40px; margin-right: 10px;"> </div>
        <h1 id="pageTitle" class="title">Random AI<br> <span id="dynamicTitle">numbers Generator</span></h1>
    </div>

    <div class="container">
        <p id="result">generating ...</p>
        <p id="info"></p>

        <div class="separator"></div>

        <h3>Generate Another One</h3>

        <form id="randomForm">
            <div class="input-group">
                <div class="input-container">
                    <label for="count">Count</label>
                    <input type="number" id="count" name="count" min="1" required>
                </div>
                <span class="dash">-</span>
                <div class="input-container">
                    <label for="max">Max</label>
                    <input type="number" id="max" name="max" min="1" required>
                </div>
            </div>
            <button type="submit">Generate</button>
        </form>

        <p id="errorMessage" class="error"></p>
    </div>

    <footer>
        <p>Code generated using <strong>ChatGPT</strong> (Version GPT-4.0) | under 25 minutes</p>
    </footer>

    <script>
        function getValuesFromURL() {
            const params = new URLSearchParams(window.location.search);
            const values = params.get('values');
            if (values) {
                return values.split('-').map(Number);
            }
            return [6, 12]; 
        }

        function updateTitles(count, max) {
            document.title = `Random AI ${count} from ${max} Number Generator`;
            document.getElementById('dynamicTitle').innerHTML = `<b>${count}</b> from <b>${max}</b>`;
            document.getElementById('result').innerText = `generating ${count}/${max}...`;
        }

        async function getIP() {
            try {
                let response = await fetch("https://api64.ipify.org?format=json");
                let data = await response.json();
                return data.ip;
            } catch (error) {
                return "Unknown IP";
            }
        }

        async function generateNumbers(count, max) {
            if (count > max) {
                document.getElementById("result").innerText = "Error: Count cannot be greater than Max!";
                return;
            }

            let numbers = [];
            while (numbers.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }

            let ip = await getIP();
            let now = new Date();
            let timestamp = now.toLocaleString('en-GB', { timeZone: 'Europe/Bucharest' });

            let ua = navigator.userAgent;
            let device = /Android|iPhone/i.test(ua) ? "Mobile" : "Desktop";
            let browser = /Chrome/.test(ua) ? "Chrome" : /Firefox/.test(ua) ? "Firefox" : /Safari/.test(ua) ? "Safari" : "Unknown";
            let version = ua.match(/(Chrome|Firefox|Safari)\/(\d+)/);
            let browserVersion = version ? version[2] : "Unknown";

            document.getElementById("result").innerText = numbers.join(", ");
            document.getElementById("info").innerText = 
                `Generated at: ${timestamp}\nIP: ${ip}\nBrowser: ${browser} v${browserVersion}, ${device}`;

            updateHistory();
        }

        function prefillForm() {
            const [count, max] = getValuesFromURL();
            document.getElementById('count').value = count;
            document.getElementById('max').value = max;
            updateTitles(count, max);
        }

        document.getElementById('randomForm').onsubmit = function(event) {
            event.preventDefault();
            const count = parseInt(document.getElementById('count').value);
            const max = parseInt(document.getElementById('max').value);

            if (count <= 0 || max <= 0) {
                document.getElementById("errorMessage").innerText = "Error: Both Count and Max must be greater than 0.";
                return;
            }

            if (count > max) {
                document.getElementById("errorMessage").innerText = "Error: Count must be less than or equal to Max.";
                return;
            }

            document.getElementById("errorMessage").innerText = "";

            generateNumbers(count, max);

            let newUrl = `?values=${count}-${max}`;
            window.history.pushState({}, '', newUrl);
        }

        function updateHistory() {
            let today = new Date().toISOString().split('T')[0];
            let history = JSON.parse(localStorage.getItem('history')) || {};
            history[today] = (history[today] || 0) + 1;
            localStorage.setItem('history', JSON.stringify(history));
            document.getElementById("info").innerText += `\nGenerated today: ${history[today]} times`;
        }

        window.onload = function() {
            prefillForm();
            const [count, max] = getValuesFromURL();
            if (count && max) {
                generateNumbers(count, max);
            }
            updateHistory();
        };
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Random AI Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        h1 {
            color: #333;
            font-size: 20px; /* Smaller title */
            font-weight: lighter; /* Lighter text */
        }
        #result {
            font-size: 40px; /* Bigger text */
            font-weight: bold;
            color: #333;
            margin-top: 20px;
            padding: 10px;
            border: 2px dashed #007BFF; /* Dashed border */
            display: inline-block;
        }
        #info {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            text-align: left;
        }
        .error {
            color: red;
            font-size: 16px;
        }
        .separator {
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            width: 120px;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        footer {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="dynamicTitle">Random AI Number Generator</h1>
        <p id="result">-</p>
        <div id="info"></div>

        <div class="separator"></div>

        <form id="randomForm">
            <div class="input-group">
                <div>
                    <label for="count">Count:</label>
                    <input type="number" id="count" name="count" min="1" required>
                </div>
                <div>
                    <label for="max">Max:</label>
                    <input type="number" id="max" name="max" min="1" required>
                </div>
            </div>
            <button type="submit">Generate</button>
        </form>

        <p id="errorMessage" class="error"></p>

        <div class="separator"></div>
        <h2>Generate Another One</h2>
    </div>

    <footer>
        <p>Code generated using <strong>ChatGPT</strong> (Version GPT-4.0)</p>
    </footer>

    <script>
        function getValuesFromURL() {
            const params = new URLSearchParams(window.location.search);
            const values = params.get('values');
            if (values) {
                return values.split('-').map(Number);
            }
            return [6, 12]; // Default values
        }

        async function getIP() {
            try {
                let response = await fetch("https://api64.ipify.org?format=json");
                let data = await response.json();
                return data.ip;
            } catch (error) {
                return "Unknown IP";
            }
        }

        function getBrowserInfo() {
            let userAgent = navigator.userAgent;
            let browserName = "Unknown";
            let browserVersion = "Unknown";
            let deviceType = "Desktop";

            if (/Chrome/.test(userAgent)) {
                browserName = "Chrome";
                browserVersion = userAgent.match(/Chrome\/(\d+)/)?.[1] || "Unknown";
            } else if (/Firefox/.test(userAgent)) {
                browserName = "Firefox";
                browserVersion = userAgent.match(/Firefox\/(\d+)/)?.[1] || "Unknown";
            } else if (/Safari/.test(userAgent) && !/Chrome/.test(userAgent)) {
                browserName = "Safari";
                browserVersion = userAgent.match(/Version\/(\d+)/)?.[1] || "Unknown";
            } else if (/Edge/.test(userAgent)) {
                browserName = "Edge";
                browserVersion = userAgent.match(/Edg\/(\d+)/)?.[1] || "Unknown";
            }

            if (/Android/.test(userAgent)) {
                deviceType = "Android";
            } else if (/iPhone|iPad|iPod/.test(userAgent)) {
                deviceType = "iOS";
            }

            return { browserName, browserVersion, deviceType };
        }

        async function generateNumbers(count, max) {
            if (count > max) {
                document.getElementById("result").innerText = "Error: Count cannot exceed Max!";
                return;
            }

            let numbers = [];
            while (numbers.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }

            let ip = await getIP();
            let now = new Date();
            let options = { timeZone: 'Europe/Bucharest', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
            let timestamp = new Intl.DateTimeFormat('en-US', options).format(now);

            let { browserName, browserVersion, deviceType } = getBrowserInfo();

            document.getElementById("result").innerText = numbers.join(", ");
            document.getElementById("info").innerText = 
                `Generated at: ${timestamp}\nIP: ${ip}\nBrowser: ${browserName} ${browserVersion}\nDevice: ${deviceType}`;
        }

        function updatePageTitle(count, max) {
            let titleText = `Random AI ${count} from ${max} Number Generator`;
            document.title = titleText;
            document.getElementById("dynamicTitle").innerHTML = `Random AI <b>${count}</b> from <b>${max}</b> Number Generator`;
        }

        function prefillForm() {
            const [count, max] = getValuesFromURL();
            document.getElementById('count').value = count;
            document.getElementById('max').value = max;
            updatePageTitle(count, max);
        }

        document.getElementById('randomForm').onsubmit = function(event) {
            event.preventDefault();
            const count = parseInt(document.getElementById('count').value);
            const max = parseInt(document.getElementById('max').value);

            if (count <= 0 || max <= 0) {
                document.getElementById("errorMessage").innerText = "Error: Both values must be greater than 0.";
                return;
            }
            if (count > max) {
                document.getElementById("errorMessage").innerText = "Error: Count must be <= Max.";
                return;
            }

            document.getElementById("errorMessage").innerText = "";
            generateNumbers(count, max);

            const newUrl = `${window.location.pathname}?values=${count}-${max}`;
            history.pushState({}, '', newUrl);
            updatePageTitle(count, max);
        }

        window.onload = function() {
            prefillForm();
            const [count, max] = getValuesFromURL();
            generateNumbers(count, max);
        };
    </script>

</body>
</html>

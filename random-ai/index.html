<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random AI Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        h1 {
            font-size: 24px;
            color: #333;
        }
        h2 {
            font-size: 20px;
            color: #333;
        }
        #randomForm {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        #randomForm label {
            margin: 10px 0;
            font-size: 16px;
        }

        #randomForm input {
            width: 60px; /* Adjust the width for inputs */
            margin: 5px 0;
            padding: 5px;
            font-size: 16px;
        }

        #randomForm button {
            width: 120px; /* Adjust the width of the button */
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }

        #info {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            text-align: left;
        }

        #history {
            font-size: 14px;
            margin-top: 10px;
            color: #333;
        }

        .error {
            color: red;
            font-size: 16px;
        }

        #generatedNote {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            text-align: left;
        }

        .separator {
            border-top: 1px solid #ddd;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        footer {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Random AI Number Generator</h1>

        <!-- Display Generated Numbers First -->
        <div>
            <p id="result">-</p>
            <div id="generatedNote">
                <p id="info"></p> <!-- Generated time, IP, Browser, and History -->
            </div>
        </div>

        <!-- Separator Line -->
        <div class="separator"></div>

        <!-- Form for Generating New Numbers -->
        <form id="randomForm">
            <label for="count">Count:</label>
            <input type="number" id="count" name="count" min="1" required><br>

            <label for="max">Max:</label>
            <input type="number" id="max" name="max" min="1" required><br>

            <button type="submit">Generate</button>
        </form>

        <p id="errorMessage" class="error"></p>

        <!-- Second Title: Generate Another One (Now below the form) -->
        <div class="separator"></div>
        <h2>Generate Another One</h2>
    </div>

    <div class="separator"></div>

    <!-- Footer with ChatGPT attribution -->
    <footer>
        <p>Code generated using <strong>ChatGPT</strong> (Version GPT-4.0)</p>
    </footer>

    <script>
        // Function to extract the 'values' parameter from the URL (e.g., ?values=6-12)
        function getValuesFromURL() {
            const params = new URLSearchParams(window.location.search);
            const values = params.get('values'); // Get the 'values' parameter value
            if (values) {
                return values.split('-').map(Number); // Convert the '6-12' value to an array of numbers
            }
            return [6, 12]; // Default to 6 random numbers from 12 if not specified
        }

        async function getIP() {
            try {
                let response = await fetch("https://api64.ipify.org?format=json");
                let data = await response.json();
                return data.ip;
            } catch (error) {
                return "Unknown IP";
            }
        }

        async function generateNumbers(count, max) {
            // If count is more than max, return an error
            if (count > max) {
                document.getElementById("result").innerText = "Error: Cannot generate more numbers than the maximum range!";
                return;
            }

            // Generate unique random numbers
            let numbers = [];
            while (numbers.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }

            // Get IP and Browser Info
            let ip = await getIP();
            let now = new Date();
            
            // Format the time in Romania's timezone
            let options = { timeZone: 'Europe/Bucharest', hour12: true };
            let timestamp = new Intl.DateTimeFormat('en-US', options).format(now);

            // Get browser info (shortened)
            let browser = navigator.userAgent;
            let browserName = 'Unknown';
            if (browser.indexOf('Chrome') > -1) {
                browserName = 'Chrome';
            } else if (browser.indexOf('Firefox') > -1) {
                browserName = 'Firefox';
            } else if (browser.indexOf('Safari') > -1) {
                browserName = 'Safari';
            } else if (browser.indexOf('Edge') > -1) {
                browserName = 'Edge';
            }

            // Display the results
            document.getElementById("result").innerText = numbers.join(", ");
            document.getElementById("info").innerText = 
                `Generated at: ${timestamp}\nIP: ${ip}\nBrowser: ${browserName}`;

            // Update the generation history
            updateHistory();
        }

        // Prefill the form using the URL parameters or fallback to default values
        function prefillForm() {
            const [count, max] = getValuesFromURL();
            document.getElementById('count').value = count;
            document.getElementById('max').value = max;
        }

        // Form submission validation
        document.getElementById('randomForm').onsubmit = function(event) {
            event.preventDefault();
            const count = parseInt(document.getElementById('count').value);
            const max = parseInt(document.getElementById('max').value);

            // Validation: count and max must be greater than 0, and max must be greater than count
            if (count <= 0 || max <= 0) {
                document.getElementById("errorMessage").innerText = "Error: Both 'Count' and 'Max' must be greater than 0.";
                return;
            }

            if (count > max) {
                document.getElementById("errorMessage").innerText = "Error: 'Count' must be less than or equal to 'Max'.";
                return;
            }

            // Clear error message if validation passes
            document.getElementById("errorMessage").innerText = "";

            generateNumbers(count, max);
        }

        // Update history of random number generations
        function updateHistory() {
            let today = new Date().toISOString().split('T')[0]; // Get today's date in YYYY-MM-DD format

            // Get the previous date and count from localStorage
            let history = JSON.parse(localStorage.getItem('history')) || {};
            if (!history[today]) {
                history[today] = 0;
            }

            // Increment the count for today
            history[today]++;

            // Store the updated history in localStorage
            localStorage.setItem('history', JSON.stringify(history));

            // Update the history display inside the info section
            document.getElementById("info").innerText += `\nGenerated today: ${history[today]} times`;
        }

        // Generate numbers based on URL params if available and prefill the form
        window.onload = function() {
            prefillForm();

            // Get the values from the URL and auto-generate the numbers if they're present
            const [count, max] = getValuesFromURL();
            if (count && max) {
                generateNumbers(count, max); // Automatically generate on first load if values are set
            }

            // Update history on page load
            updateHistory();
        };
    </script>

</body>
</html>

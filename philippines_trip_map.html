<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Philippines Trip Map</title>
    <style>html, body {margin: 0; height: 100%;}</style>
    <style>#map {height: 100%;}</style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.6.0/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.6.0/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
</head>
<body>
<div id="map"></div>
<script>
    var map = L.map('map', {
        center: [11.5, 122.0],
        zoom: 6
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    var lastOpenedPopup = null;

    function addMarker(lat, lng, location, date) {
        var marker = L.marker([lat, lng], {
            icon: L.AwesomeMarkers.icon({
                icon: 'info-sign',
                prefix: 'glyphicon',
                markerColor: 'blue',
                iconColor: 'white'
            })
        }).addTo(map);

        var popupContent = `<strong>${location}</strong><br>${date}`;
        var popup = L.popup().setContent(popupContent);

        marker.bindPopup(popup);
        marker.bindTooltip(location, {sticky: true});

        marker.on('click', function () {
            if (lastOpenedPopup && map.hasLayer(lastOpenedPopup)) {
                map.closePopup(lastOpenedPopup);
            }
            this.openPopup();
            lastOpenedPopup = popup;
        });
    }

    addMarker(14.5995, 120.9842, "Manila", "21 Oct & 4 Nov");
    addMarker(12.0526, 119.9206, "Coron (Busuanga)", "22–24 Oct");
    addMarker(11.2029, 119.4142, "El Nido", "24–28 Oct");
    addMarker(9.5206, 123.4291, "Oslob", "29 Oct");
    addMarker(9.943, 123.3956, "Moalboal", "30 Oct");
    addMarker(9.6477, 123.8556, "Bohol (Tagbilaran)", "31 Oct – 1 Nov");
    addMarker(11.9674, 121.9248, "Boracay (Caticlan)", "2–3 Nov");

    // Route line
    var route = [
        [14.5995, 120.9842],
        [12.0526, 119.9206],
        [11.2029, 119.4142],
        [9.5206, 123.4291],
        [9.943, 123.3956],
        [9.6477, 123.8556],
        [11.9674, 121.9248]
    ];

    L.polyline(route, {
        color: 'red',
        weight: 3,
        opacity: 0.7
    }).addTo(map);
</script>
</body>
</html>
